name: emulator-probe

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: URL of the APK (or a .zip containing one)
        required: true
        default: https://x0.at/BAAi.zip
      apk_sha256:
        description: expected sha256 of the APK (blank to skip)
        required: false
        default: e882e7dc7387112fea464419143c8932e84c72f031a47c6dba0d83c0fb42e4b3
      api_level:
        description: emulator API level
        required: false
        default: "33"
      driver:
        description: driver script under scripts/
        required: false
        default: scripts/probe.sh

concurrency:
  group: emulator-${{ github.ref }}-${{ github.event.inputs.driver }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fetch the APK
        run: |
          set -eux
          mkdir -p out
          curl -fL --retry 3 --retry-delay 5 -o dl.bin "${{ github.event.inputs.apk_url }}"
          if unzip -l dl.bin >/dev/null 2>&1; then
            unzip -o -j dl.bin '*.apk' -d .
          else
            mv dl.bin app.apk
          fi
          ls -la *.apk
          sha256sum *.apk | tee out/build.txt
          sha="${{ github.event.inputs.apk_sha256 }}"
          if [ -n "$sha" ]; then echo "$sha  warn" >/dev/null; sha256sum -c <(echo "$sha  $(ls *.apk | head -1)"); fi
          mv "$(ls *.apk | head -1)" app.apk

      - name: Boot the emulator and drive the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || 33 }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none -netdelay none -netspeed full
          script: bash ${{ github.event.inputs.driver || 'scripts/probe.sh' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
